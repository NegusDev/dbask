name: Test Suite

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev

# Cancel superseded runs on the same ref (saves CI minutes).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of least privilege.
permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # PostgreSQL, MySQL and MariaDB for the adapter integration tests
    # (tests/postgres-adapter.test.ts, tests/mysql-adapter.test.ts).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: harness
          POSTGRES_PASSWORD: harness-pass
          POSTGRES_DB: harness_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U harness -d harness_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root-pass
          MYSQL_DATABASE: harness_test
          MYSQL_USER: harness
          MYSQL_PASSWORD: harness-pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uharness -pharness-pass"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: root-pass
          MARIADB_DATABASE: harness_test
          MARIADB_USER: harness
          MARIADB_PASSWORD: harness-pass
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: 5432
      TEST_PG_DATABASE: harness_test
      TEST_PG_USER: harness
      TEST_PG_PASSWORD: harness-pass
      TEST_MYSQL_HOST: 127.0.0.1
      TEST_MYSQL_PORT: 3306
      TEST_MYSQL_DATABASE: harness_test
      TEST_MYSQL_USER: harness
      TEST_MYSQL_PASSWORD: harness-pass

    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]    # package.json engines: >=22

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      # The step above ran the MySQL adapter tests against MySQL 8.4; run them
      # against MariaDB too, since both are supported.
      - name: MariaDB adapter tests
        run: pnpm vitest run tests/mysql-adapter.test.ts
        env:
          TEST_MYSQL_PORT: 3307

      - name: Build
        run: pnpm build

      - name: Smoke-test the built CLI
        run: pnpm smoke

      - name: Check package contents
        run: pnpm pack:check

  # The terminal UI, process handling and paths differ by platform, so the
  # same checks run on macOS and Windows. The PostgreSQL integration tests need
  # a service container (Linux only) and skip themselves here.
  platforms:
    name: ${{ matrix.os }}, Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Run test suite
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Smoke-test the built CLI
        run: pnpm smoke
